name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Renderizar los payloads de job (valida JSON y placeholders)
        run: python scripts/render_job_json.py --workspace-user ci@example.com --out-dir build/jobs

      # La sintaxis de notebooks y scripts la comprueba tests/test_syntax.py
      # (los notebooks de Databricks usan await de nivel superior).
      - name: Tests
        run: pytest -q
